# =====================================================================
#                       Stone Message - config.yml
#                        A plugin by Stone Plugins
# =====================================================================
#
# This file contains SETTINGS (switches, channels, timings) as well as
# the actual join/leave text itself - both live here (not in
# messages.yml) so the whole "what does a join/leave look like"
# experience is configured in one single place.
#
# Text for every channel (chat/actionbar/title+subtitle) stays filled in
# under "messages" at the same time - the "notification" field just
# picks which ONE of them is actually shown, so you can change your mind
# later without having to write the text again.
#
# General command feedback (help, reload, errors, ...) is translated
# per-language instead, in:
#   plugins/StoneMessage/languages/<language>/messages.yml
#
# ---------------------------------------------------------------------
# Available placeholders (usable in every message below):
#   {player}          - the player's name
#   {displayname}      - the player's display name (nickname/prefix aware)
#   {uuid}             - the player's UUID
#   {world}            - the world the player is in
#   {x} {y} {z}        - the player's block coordinates
#   {online}           - players currently online (vanished players aren't
#                         counted, see "vanish" below)
#   {max}              - the server's player slot limit
#   {ping}             - the player's current ping in milliseconds
#   {gamemode}         - the player's current game mode (SURVIVAL, CREATIVE, ...)
#   {tps}              - the server's current ticks-per-second
#   {server_name}      - the server's MOTD
#   {last_seen_date}   - only in join messages: formatted date/time the
#                         player was last online (see date-format below,
#                         empty on a player's very first join)
#   {first_join_date}  - only in join messages: formatted date/time this
#                         player first ever joined
#   {days_offline}     - only in join messages: full days since this player
#                         was last online (0 if less than a day, first join
#                         has no meaningful value and is best avoided there)
#   {hours_offline}    - only in join messages: hours since last online,
#                         useful for a more precise message than days
#   {prefix}           - the player's LuckPerms prefix (empty if LuckPerms
#                         isn't installed)
#   {suffix}           - the player's LuckPerms suffix (empty if LuckPerms
#                         isn't installed)
#   {rank}             - the player's primary LuckPerms group, e.g. "admin"
#                         (empty if LuckPerms isn't installed)
#   {level}            - the player's XP level
#   {playtime}         - total time played on this server, e.g. "2d 3h 15m"
#   {date}             - the current date/time (see date-format below)
#   {join_count}       - only in join messages: how often this player has
#                         joined, this join included (1 on a first join)
#   {unique_players}   - only in join messages: how many different players
#                         have ever joined - on a first join that is the new
#                         player's number, e.g. "You are player #{unique_players}"
#   {time_offline}     - only in join messages: time since last online,
#                         e.g. "3d 4h" (empty on a first join)
#   {session_time}     - only in leave messages: how long the player was
#                         online this time, e.g. "1h 20m"
#
# If PlaceholderAPI is installed, any %placeholder% (LuckPerms, Vault, or
# any other expansion you have) also works directly in every message below -
# no extra setup needed, it's just resolved automatically.
# ---------------------------------------------------------------------
#
# Missing options are added automatically on plugin updates. Existing
# values you changed are never overwritten, even in nested sections.
# =====================================================================

# Layout version of this file, used to migrate it automatically when an
# update renames or moves options. Do not change this value.
config-version: 1

# Language used for general command feedback. Must match a folder under
# languages/ - "en" and "de" ship by default. New installs always default
# to English until an admin changes this.
language: en

# Pattern used to render {last_seen_date}, {first_join_date} and {date}, following
# Java's SimpleDateFormat syntax (e.g. "dd.MM.yyyy HH:mm" -> 28.07.2026 14:05).
date-format: "dd.MM.yyyy HH:mm"

# ---------- JOIN ----------
join:
  # Replace the vanilla "Player joined the game" message with the text below.
  # If false, no join message is shown at all (vanilla one stays hidden either way).
  enabled: true

  # Where the join message is shown. CHAT, ACTIONBAR or TITLE.
  notification: CHAT

  # Text for every channel - only the one picked above is actually used.
  # TITLE uses "title" + "subtitle" together.
  messages:
    chat: "&8[&a+&8] &a{player} &7joined the game. &8(&7{online}&8/&7{max}&8)"
    actionbar: "&a➜ {player} joined the game"
    title: "&a&l{player}"
    subtitle: "&7joined the game"

  # A private message from the server that ONLY the joining player sees, in
  # addition to the public message above. Has its own channel, and "chat"
  # may also be a list to send several lines.
  private:
    enabled: false
    notification: CHAT
    messages:
      chat:
        - "&7Welcome back, &f{player}&7! This is visit &f#{join_count}&7."
        - "&7You were away for &f{time_offline}&7 - total playtime: &f{playtime}"
      actionbar: "&7Welcome back, &f{player}&7!"
      title: "&a&lWelcome back"
      subtitle: "&7You were away for {time_offline}"

  # A separate, one-time message shown the very first time a player ever
  # joins the server - great for a personal welcome. Uses the same
  # notification channel as above (join.notification).
  first-join:
    enabled: true
    messages:
      chat: "&8[&e★&8] &eWelcome, &f{player}&e, this is your first time here!"
      actionbar: "&e★ Welcome, {player}!"
      title: "&e&lWelcome!"
      subtitle: "&7{player}, enjoy your stay"

    # Private message for the very first join only. If disabled, a first
    # join gets the normal private message above (if that one is enabled).
    private:
      enabled: false
      notification: TITLE
      messages:
        chat:
          - "&eWelcome to the server, &f{player}&e!"
          - "&7You are player &f#{unique_players}&7 - have fun!"
        actionbar: "&e★ You are player #{unique_players}!"
        title: "&e&lWelcome!"
        subtitle: "&7You are player #{unique_players}"

# ---------- LEAVE ----------
leave:
  # Replace the vanilla "Player left the game" message with the text below.
  enabled: true

  # Where the leave message is shown. CHAT, ACTIONBAR or TITLE.
  notification: CHAT

  # Text for every channel - only the one picked above is actually used.
  messages:
    chat: "&8[&c-&8] &c{player} &7left the game. &8(&7{online}&8/&7{max}&8)"
    actionbar: "&c➜ {player} left the game"
    title: "&c&l{player}"
    subtitle: "&7left the game"

# ---------- VANISH ----------
# Works with vanish plugins that set the common "vanished" player metadata
# (SuperVanish, PremiumVanish, EssentialsX and most others).
vanish:
  # Players who join or leave while vanished get no join/leave message, and
  # {online} doesn't count vanished players.
  enabled: true
  # Going into vanish while online shows the normal leave message, as if the
  # player had left.
  fake-leave-on-vanish: true
  # Coming out of vanish shows the normal join message, as if the player had
  # just joined.
  fake-join-on-unvanish: true
  # How often vanish changes are checked (20 ticks = 1 second).
  check-interval-ticks: 10

# Shared Title timing, used whenever a "notification" above is TITLE.
title-timing:
  fade-in-ticks: 5
  stay-ticks: 40
  fade-out-ticks: 10

# Checks https://modrinth.com/project/stone-message for a newer plugin
# version. Console feedback is always printed once right on startup. If
# a newer version is found, everyone with stonemessage.admin (or OP) is
# reminded every time they join, until the plugin is updated.
update-checker:
  enabled: true
  check-interval-minutes: 60
